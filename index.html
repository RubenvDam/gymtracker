<!doctype html>
<html lang="en" data-theme="light" data-accent="aurora">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gym" />
    <title>Gym Tracker</title>
    <script>
      // Apply saved appearance before first paint (mirrors src/lib/theme.ts).
      try {
        var a = JSON.parse(localStorage.getItem('gymtracker.appearance') || '{}')
        var t = a.theme || 'light'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.accent = a.accent || 'aurora'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f2f2f5')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
